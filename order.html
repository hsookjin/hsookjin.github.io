<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퉁치기 v.260228</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4b6af1 0%, #43b9f3 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }
        
        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 1.1em;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        button {
            background: linear-gradient(135deg, #4d4d4f 0%, #434344 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }
        
        .result-box h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        
        .result-content {
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }
        
        .count {
            color: #667eea;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .input-section,
            .result-section {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 퉁치기 계산</h1>
        
        <div class="input-section">
            <div class="input-group">
                <label for="sellInput">매도 주문 입력</label>
                <textarea id="sellInput" placeholder="LOC $44.31 511&#10;LOC $44.31 505&#10;LOC $43.77 510"></textarea>
            </div>
            
            <div class="input-group">
                <label for="buyInput">매수 주문 입력</label>
                <textarea id="buyInput" placeholder="LOC $43.24 532"></textarea>
            </div>
        </div>
        
        <div class="btn-container">
            <button onclick="processOrders()">🚀 주문 처리하기</button>
        </div>
        
        <div class="result-section">
            <div class="result-box">
                <h2>매수 주문 <span class="count" id="buyCount"></span></h2>
                <div class="result-content" id="buyResult">결과가 여기에 표시됩니다...</div>
            </div>
            
            <div class="result-box">
                <h2>새로운 매도 주문 <span class="count" id="sellCount"></span></h2>
                <div class="result-content" id="sellResult">결과가 여기에 표시됩니다...</div>
            </div>
        </div>
    </div>

    <script>
        class Order {
            constructor(type, price, quantity, side) {
                this.type = type;
                this.price = parseFloat(price) || 0.0;
                this.quantity = parseInt(quantity);
                this.side = side;
            }
        }

        function parseData(textData, side) {
            const orders = [];
            const lines = textData.trim().split('\n');
            
            for (const line of lines) {
                const parts = line.trim().split(/\s+/);
                if (parts.length >= 3) {
                    const oType = parts[0];
                    const oPrice = parts[1].replace('$', '').replace(/,/g, '');
                    const oQty = parseInt(parts[2].replace(/,/g, ''));
                    
                    // MOC 병합 로직
                    if (oType === "MOC") {
                        const existingMoc = orders.find(o => o.type === "MOC");
                        if (existingMoc) {
                            existingMoc.quantity += oQty;
                            continue;
                        }
                    }
                    
                    orders.push(new Order(oType, oPrice, oQty, side));
                }
            }
            return orders;
        }

        function removeDuplicates(sellOrders, buyOrders) {
            if (!sellOrders.length || !buyOrders.length) {
                return { sells: sellOrders, buys: buyOrders };
            }

            const buyOrder = { ...buyOrders[0] }; // 복사
            const originalBuyQuantity = buyOrder.quantity;

            const filteredSellOrders = [];
            const newSellOrders = [];
            const newBuyOrders = [];

            let sellMocOrder = null;
            let hasMoc = false;

            // 1. 매도 주문 분류
            for (const sell of sellOrders) {
                if (sell.type === "MOC") {
                    sellMocOrder = sell;
                    hasMoc = true;
                } else if (sell.price <= buyOrder.price) {
                    filteredSellOrders.push(sell);
                } else {
                    newSellOrders.push(sell);
                }
            }

            if (!hasMoc && !filteredSellOrders.length) {
                return { sells: sellOrders, buys: buyOrders };
            }

            // 2. MOC 처리
            if (hasMoc) {
                if (sellMocOrder.quantity > buyOrder.quantity) {
                    newSellOrders.push(new Order("MOC", 0.0, sellMocOrder.quantity - buyOrder.quantity, "매도"));
                    buyOrder.quantity = 0;
                } else if (sellMocOrder.quantity === buyOrder.quantity) {
                    buyOrder.quantity = 0;
                } else {
                    buyOrder.quantity -= sellMocOrder.quantity;
                    if (!filteredSellOrders.length) {
                        newSellOrders.push(new Order("LOC", buyOrder.price + 0.01, sellMocOrder.quantity, "매도"));
                    }
                }
            }

            // 3. 충돌 LOC 처리
            filteredSellOrders.sort((a, b) => a.price - b.price);

            for (const sell of filteredSellOrders) {
                if (buyOrder.quantity === 0) {
                    newSellOrders.push(sell);
                    continue;
                }

                if (sell.quantity >= buyOrder.quantity) {
                    newBuyOrders.push(new Order("LOC", sell.price - 0.01, buyOrder.quantity, "매수"));
                    
                    if (sell.quantity > buyOrder.quantity) {
                        newSellOrders.push(new Order("LOC", sell.price, sell.quantity - buyOrder.quantity, "매도"));
                    }
                    
                    buyOrder.quantity = 0;
                } else {
                    newBuyOrders.push(new Order("LOC", sell.price - 0.01, sell.quantity, "매수"));
                    buyOrder.quantity -= sell.quantity;
                }
            }

            // 4. 마무리 처리
            if (buyOrder.quantity !== 0) {
                newBuyOrders.push(new Order("LOC", buyOrder.price, buyOrder.quantity, "매수"));
                
                const matchedSellQty = filteredSellOrders.reduce((sum, o) => sum + o.quantity, 0);
                if (matchedSellQty !== 0) {
                    newSellOrders.push(new Order("LOC", buyOrder.price + 0.01, matchedSellQty, "매도"));
                }
            } else {
                newSellOrders.push(new Order("LOC", buyOrder.price + 0.01, originalBuyQuantity, "매도"));
            }

            // 5. 정렬
            newSellOrders.sort((a, b) => b.price - a.price);
            newBuyOrders.sort((a, b) => b.price - a.price);

            return { sells: newSellOrders, buys: newBuyOrders };
        }

        function processOrders() {
            const sellInput = document.getElementById('sellInput').value;
            const buyInput = document.getElementById('buyInput').value;

            const sellOrders = parseData(sellInput, "매도");
            const buyOrders = parseData(buyInput, "매수");

            const result = removeDuplicates(sellOrders, buyOrders);

            // 매수 결과 표시
            const buyResult = document.getElementById('buyResult');
            const buyCount = document.getElementById('buyCount');
            buyCount.textContent = `(${result.buys.length}개)`;
            
            if (result.buys.length === 0) {
                buyResult.textContent = '주문 없음';
            } else {
                buyResult.textContent = result.buys.map(o => 
                    `${o.type} $${o.price.toFixed(2)} ${o.quantity}`
                ).join('\n');
            }

            // 매도 결과 표시
            const sellResult = document.getElementById('sellResult');
            const sellCount = document.getElementById('sellCount');
            sellCount.textContent = `(${result.sells.length}개)`;
            
            if (result.sells.length === 0) {
                sellResult.textContent = '주문 없음';
            } else {
                sellResult.textContent = result.sells.map(o => 
                    `${o.type} $${o.price.toFixed(2)} ${o.quantity}`
                ).join('\n');
            }
        }

        // 페이지 로드 시 자동 실행
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // 'sell'과 'buy' 파라미터에서 데이터를 가져옴
            const sellData = urlParams.get('sell');
            const buyData = urlParams.get('buy');

            if (sellData) {
                // 구분자('|')를 줄바꿈('\n')으로 바꿔서 textarea에 입력
                document.getElementById('sellInput').value = sellData.split('|').join('\n');
            }
            
            if (buyData) {
                document.getElementById('buyInput').value = buyData.split('|').join('\n');
            }

            // 데이터가 들어왔으면 자동으로 계산 실행
            if (sellData || buyData) {
                processOrders();
            }
        };
    </script>
</body>
</html>
